<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">boss in a Claude Code session</title>
  <desc id="d">You type /boss fix the export filter and add date range to search. boss sharpens the ask, routes the filter fix to haiku and the date range to sonnet, runs both, reviews the full diff, re-runs the gate, and reports: done, 4 files, gates pass, 1 judgment call: reused existing debounce, ok?</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="win"><rect x="10" y="10" width="780" height="360" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #ECE8F2; white-space: pre; }
    .dim { fill: #7D7889; } .mid { fill: #B9B4C6; } .b { font-weight: 700; }
    .pr { fill: #D97757; } .ok { fill: #4ADE80; } .call { fill: #F5B971; }
    .cmd { fill: #D8C7FF; font-weight: 700; }
    .hk { fill: #5EEAD4; } .sn { fill: #7DD3FC; } .op { fill: #C4B5FD; } .fb { fill: #F5B971; }
    .sm { font-size: 12.5px; }

    /* Base styles are the final frame; animations only run from the start state toward it. */
    .type { transform: translateX(504px); animation: type 1.7s steps(56, end) .4s both; }
    .cover { opacity: 0; animation: hide .01s 2.15s both; }
    .cur1 { opacity: 0; animation: hide .01s 2.5s both; }
    .in { animation: in .35s ease-out both; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.4,0,.2,1) both; }
    .blink { animation: blink 1.1s steps(1) 7.7s infinite; }
    .d1 { animation-delay: 2.8s; } .d2 { animation-delay: 3.4s; } .d3 { animation-delay: 3.9s; }
    .d4 { animation-delay: 5.0s; } .d5 { animation-delay: 6.0s; } .d6 { animation-delay: 6.5s; }
    .d7 { animation-delay: 7.1s; } .d8 { animation-delay: 7.6s; }
    .g1 { animation-delay: 3.95s; animation-duration: 1.05s; } .g2 { animation-delay: 3.95s; animation-duration: 2.05s; }

    @keyframes type { from { transform: translateX(0); } to { transform: translateX(504px); } }
    @keyframes hide { from { opacity: 1; } to { opacity: 0; } }
    @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="780" height="360" rx="12" fill="#0D0B12" filter="url(#shadow)"/>
  <rect x="10" y="10" width="780" height="360" rx="12" fill="#0D0B12"/>
  <g clip-path="url(#win)">
    <rect x="10" y="10" width="780" height="36" fill="#16131E"/>
    <rect x="10" y="330" width="780" height="40" fill="#110F18"/>
    <line x1="10" y1="46" x2="790" y2="46" stroke="#241F30"/>
    <line x1="10" y1="330" x2="790" y2="330" stroke="#241F30"/>
    <circle cx="34" cy="28" r="6" fill="#FF5F57"/>
    <circle cx="54" cy="28" r="6" fill="#FEBC2E"/>
    <circle cx="74" cy="28" r="6" fill="#28C840"/>
    <text x="400" y="32.5" text-anchor="middle" class="dim sm">claude code · ~/shop</text>
    <!-- mini logo -->
    <g transform="translate(752 15) scale(0.16)">
      <rect width="128" height="128" rx="28" fill="url(#edge)"/>
      <g stroke="#fff" stroke-width="7" stroke-linecap="round"><line x1="64" y1="46" x2="32" y2="88"/><line x1="64" y1="46" x2="64" y2="92"/><line x1="64" y1="46" x2="96" y2="88"/></g>
      <circle cx="64" cy="40" r="16" fill="#fff"/><circle cx="32" cy="92" r="10" fill="#fff"/><circle cx="64" cy="96" r="10" fill="#fff"/><circle cx="96" cy="92" r="10" fill="#fff"/>
    </g>

    <!-- prompt, typed in -->
    <text x="36" y="82" class="pr b">❯</text>
    <text x="58" y="82"><tspan class="cmd">/boss</tspan> fix the export filter and add date range to search</text>
    <g class="type">
      <rect class="cover" x="58" y="64" width="700" height="24" fill="#0D0B12"/>
      <rect class="cur1" x="58" y="68" width="9" height="18" fill="#ECE8F2"/>
    </g>

    <!-- sharpen + route -->
    <g class="in d1"><text x="36" y="120" class="dim">◇</text><text x="58" y="120" class="dim">sharpen</text><text x="148" y="120" class="mid">2 separable tasks · pass/fail: npm test · src/api untouched</text></g>
    <g class="in d2"><text x="36" y="146" class="pr">→</text><text x="58" y="146">2 tasks. <tspan class="hk">haiku</tspan>: filter fix. <tspan class="sn">sonnet</tspan>: date range. running.</text></g>

    <!-- lanes at work -->
    <g class="in d3">
      <circle cx="84" cy="177" r="4" class="hk"/><text x="96" y="182" class="hk">haiku</text><text x="180" y="182" class="mid">export filter</text>
      <rect x="370" y="173" width="240" height="8" rx="4" fill="#211D2B"/>
      <rect class="bar g1" x="370" y="173" width="240" height="8" rx="4" fill="#5EEAD4"/>
      <circle cx="84" cy="203" r="4" class="sn"/><text x="96" y="208" class="sn">sonnet</text><text x="180" y="208" class="mid">search date range</text>
      <rect x="370" y="199" width="240" height="8" rx="4" fill="#211D2B"/>
      <rect class="bar g2" x="370" y="199" width="240" height="8" rx="4" fill="#7DD3FC"/>
    </g>
    <g class="in d4"><text x="628" y="182" class="mid">1 file</text><text x="704" y="182" class="ok">✓</text></g>
    <g class="in d5"><text x="628" y="208" class="mid">3 files</text><text x="704" y="208" class="ok">✓</text></g>

    <!-- review + report -->
    <g class="in d6"><text x="36" y="244" class="dim">◇</text><text x="58" y="244" class="dim">review</text><text x="148" y="244" class="mid">full diff read · gate re-run · change exercised</text></g>
    <g class="in d7"><text x="36" y="270" class="ok b">✓</text><text x="58" y="270"><tspan class="b">done.</tspan> 4 files, gates pass. <tspan class="call">1 judgment call:</tspan> reused existing debounce — ok?</text></g>
    <g class="in d8"><text x="36" y="306" class="pr b">❯</text><rect class="blink" x="58" y="292" width="9" height="18" fill="#ECE8F2"/></g>

    <!-- status bar: lanes used are filled, lanes on standby are rings -->
    <text x="36" y="354.5" class="dim sm">lanes</text>
    <circle cx="94" cy="350" r="4" fill="none" stroke="#5EEAD4" stroke-width="1.5"/><circle cx="94" cy="350" r="4" class="hk in d3"/><text x="104" y="354.5" class="mid sm">haiku</text>
    <circle cx="166" cy="350" r="4" fill="none" stroke="#7DD3FC" stroke-width="1.5"/><circle cx="166" cy="350" r="4" class="sn in d3"/><text x="176" y="354.5" class="mid sm">sonnet</text>
    <circle cx="245" cy="350" r="4" fill="none" stroke="#C4B5FD" stroke-width="1.5"/><text x="255" y="354.5" class="dim sm">opus</text>
    <circle cx="309" cy="350" r="4" fill="none" stroke="#F5B971" stroke-width="1.5"/><text x="319" y="354.5" class="dim sm">fable advisor</text>
    <text x="764" y="354.5" text-anchor="end" class="dim sm">builders never commit · report ≤ 8 lines</text>
  </g>
  <rect x="10.75" y="10.75" width="778.5" height="358.5" rx="11.5" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
