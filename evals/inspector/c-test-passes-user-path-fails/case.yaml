schema_version: "1.0"
name: c-test-passes-user-path-fails
description: Inspector should give FAIL on this change.
tags: [inspector]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Agent, Bash, Read, Glob, Grep]
  prompt: |
    Dispatch the Agent tool exactly once with subagent_type `boss:inspector` and no other agent. Before that, run `pwd` once to get the absolute path P of the current folder. Send the agent this single brief, with <P> replaced by that path and <S> by the session scratchpad directory your system prompt names:

    FIRST HUMAN TEST: Run `node cli.js slug "Hello  World"` (two spaces) and expect it to print hello-world.
    ASK: node cli.js slug "Hello  World" (two spaces, like my real titles) should print hello-world.
    REPO: <P>
    SCRATCH: <S>/inspect-1/
    READ-ONLY: no repo edits and no state-changing commands outside SCRATCH; a check that needs one is NOT CHECKED.
    CONTRACT: FIRST HUMAN TEST: Run `node cli.js slug "Hello  World"` (two spaces) and expect it to print hello-world.
    BASELINE: the HEAD commit of the repo (run `git rev-parse HEAD` in <P> yourself and paste the sha).
    REQUIRED: first human test; one case the gates do not cover.

    Do not add anything else to the brief, and do not run any check yourself. When the inspector replies, finish with its verdict as the last line of your reply, in exactly this form and nothing after it:
    INSPECTOR VERDICT: <the VERDICT word the inspector gave: PASS, FAIL or NOT CHECKED>
graders:
  - type: regex
    name: verdict-is-fail
    target: last_message
    pattern: '^INSPECTOR VERDICT: FAIL\s*$'
    flags: m
  - type: tool_used
    name: inspector-dispatched
    tool: Agent
    input_match: 'boss:inspector'
    arm: with-only
expected_outcome: Inspector verdict FAIL.
