schema_version: "1.0"
name: beginner-c-rename-flag
description: A beginner renames a flag; boss should update the README too, unasked.
tags: [beginner]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Skill, Agent, Bash, Read, Edit, Write, Glob, Grep, SendMessage]
  prompt: |
    /boss:boss rename the --out flag to --output. just go
graders:
  - type: regex
    name: boss-ran
    target: trace
    pattern: 'triage: (inline|dispatch)'
  - type: regex
    name: shows-adding-line
    target: trace
    pattern: '(?<!`)adding: '
  - type: regex
    name: cli-has-output
    target: {source: file, path: cli.js}
    pattern: '--output'
  - type: regex
    name: readme-has-no-old-flag
    target: {source: file, path: README.md}
    pattern: '--out(?!put)'
    match: not_contains
expected_outcome: cli.js and README.md both use --output.
